<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스마일멘토 시즌5</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8f9fa;min-height:100vh}
.app{max-width:480px;margin:0 auto;padding:1.5rem;min-height:100vh;background:#fff;position:relative}
.view{display:none}.view.active{display:block}
.logo{font-size:13px;color:#888;margin-bottom:1.2rem;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#ccc;display:inline-block;flex-shrink:0}
.dot.connected{background:#22c55e}
.banner{width:100%;border-radius:12px;overflow:hidden;margin-bottom:1.2rem}
.banner img{width:100%;display:block}
.page-title{font-size:20px;font-weight:600;color:#111;margin-bottom:6px}
.page-sub{font-size:15px;color:#666;margin-bottom:1.5rem}
.btn{display:inline-flex;align-items:center;gap:6px;padding:12px 20px;border-radius:10px;border:none;cursor:pointer;font-size:15px;font-weight:500;transition:opacity 0.15s;justify-content:center}
.btn:hover{opacity:0.85}
.btn:disabled{opacity:0.4;cursor:not-allowed}
.btn-primary{background:#111;color:#fff}
.btn-secondary{background:#f1f3f5;color:#111;border:1px solid #ddd}
.btn-sm{padding:8px 14px;font-size:13px}
.team-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.5rem}
.team-btn{padding:14px 8px;border-radius:12px;border:none;cursor:pointer;font-size:14px;font-weight:600;color:#fff;text-align:center;transition:all 0.15s;opacity:0.85}
.team-btn:hover{opacity:1;transform:translateY(-1px)}
.team-btn.selected{outline:3px solid #111;outline-offset:2px;opacity:1;transform:translateY(-1px)}
.team-btn.blue{background:#1a87c8}
.team-btn.red{background:#e8472a}
.section-label{font-size:13px;font-weight:600;color:#444;margin-bottom:8px;display:flex;align-items:center;gap:4px}
.section-label .required{color:#e8472a;font-size:11px}
.input-title{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid #dee2e6;background:#f8f9fa;color:#111;font-size:15px;font-family:inherit;outline:none;line-height:1.5}
.input-title.editable{background:#fff}
.input-title:focus{border-color:#666}
.input-title[readonly]{color:#555;cursor:default}
.input-area{width:100%;min-height:110px;padding:12px 14px;border-radius:10px;border:1.5px solid #dee2e6;background:#fff;color:#111;font-size:15px;font-family:inherit;resize:vertical;outline:none;line-height:1.6}
.input-area:focus{border-color:#666}
.char-count{font-size:12px;color:#aaa;text-align:right;margin-top:4px}
.field-gap{height:14px}
.submit-row{margin-top:1.2rem}
.success-wrap{text-align:center;padding:3rem 1rem}
.success-icon{font-size:52px;color:#22c55e;margin-bottom:1rem}
.success-wrap h2{font-size:20px;font-weight:600;margin-bottom:8px;color:#111}
.success-wrap p{color:#666;font-size:14px;margin-bottom:2rem}
.feed-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.filter-scroll{overflow-x:auto;white-space:nowrap;margin-bottom:10px;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.filter-scroll::-webkit-scrollbar{height:3px}
.filter-scroll::-webkit-scrollbar-track{background:#f1f3f5;border-radius:2px}
.filter-scroll::-webkit-scrollbar-thumb{background:#dee2e6;border-radius:2px}
.filter-row{display:inline-flex;gap:6px}
.filter-chip{padding:5px 12px;border-radius:20px;border:1.5px solid #dee2e6;background:#f8f9fa;font-size:12px;color:#666;cursor:pointer;font-weight:500;white-space:nowrap;flex-shrink:0;transition:all 0.15s}
.filter-chip.active{background:#111;color:#fff;border-color:#111}
.feed{display:flex;flex-direction:column;gap:10px}
.opinion-card{padding:14px 16px;border-radius:12px;background:#f8f9fa;border:1px solid #e9ecef;animation:slideIn 0.3s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.opinion-card.hot-1{background:linear-gradient(135deg,#fff8e1 0%,#fff3cd 100%);border:1.5px solid #ffd54f;position:relative}
.opinion-card.hot-2{background:linear-gradient(135deg,#f5f5f5 0%,#ececec 100%);border:1.5px solid #bdbdbd;position:relative}
.opinion-card.hot-3{background:linear-gradient(135deg,#fff3e0 0%,#ffe0b2 100%);border:1.5px solid #ffb74d;position:relative}
.hot-badge{position:absolute;top:-1px;right:10px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:0 0 8px 8px;color:#fff;letter-spacing:0.3px}
.hot-1 .hot-badge{background:#f59e0b}
.hot-2 .hot-badge{background:#9e9e9e}
.hot-3 .hot-badge{background:#f97316}
.hot-divider{border:none;border-top:1.5px dashed #dee2e6;margin:14px 0 10px}
.topic-rank-section{margin-bottom:1.4rem}
.topic-rank-title{font-size:14px;font-weight:700;color:#111;margin-bottom:10px;padding-bottom:6px;border-bottom:1.5px solid #f1f3f5}
.topic-rank-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.topic-rank-medal{font-size:16px;width:24px;flex-shrink:0;text-align:center}
.topic-rank-team-tag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:6px;color:#fff;width:62px;text-align:center;flex-shrink:0}
.topic-rank-team-tag.blue{background:#1a87c8}
.topic-rank-team-tag.red{background:#e8472a}
.topic-rank-bar-wrap{flex:1;height:7px;background:#e9ecef;border-radius:4px;overflow:hidden}
.topic-rank-bar{height:100%;border-radius:4px;transition:width 0.4s}
.topic-rank-hearts{font-size:12px;color:#e8472a;font-weight:600;width:36px;text-align:right;flex-shrink:0}
.card-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.card-meta-left{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.team-tag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:6px;color:#fff}
.team-tag.blue{background:#1a87c8}
.team-tag.red{background:#e8472a}
.topic-tag{font-size:11px;font-weight:500;padding:3px 8px;border-radius:6px;background:#e9ecef;color:#555}
.card-time{font-size:11px;color:#aaa}
.card-title-text{font-size:14px;font-weight:600;color:#111;margin-bottom:4px}
.card-text{font-size:14px;color:#444;line-height:1.7;margin-bottom:10px}
.card-footer{display:flex;align-items:center;margin-top:6px}
.heart-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;border:1.5px solid #fecdd3;background:#fff5f5;cursor:pointer;font-size:13px;color:#e8472a;font-weight:500;transition:all 0.15s}
.heart-btn:hover{background:#ffe4e6}
.heart-btn.liked{background:#e8472a;color:#fff;border-color:#e8472a;cursor:default}
.inactive .heart-btn:not(.liked){opacity:0.35;cursor:not-allowed}
.empty-feed{text-align:center;padding:3rem;color:#aaa;font-size:14px}
.empty-feed i{font-size:36px;display:block;margin-bottom:10px}
.stats-top{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1.2rem}
.stat-card{padding:12px;border-radius:12px;background:#f8f9fa;border:1px solid #e9ecef;text-align:center}
.stat-num{font-size:26px;font-weight:700;color:#111}
.stat-label{font-size:11px;color:#888;margin-top:2px}
.stat-sub-tabs{display:flex;gap:6px;margin-bottom:1rem;flex-wrap:wrap}
.stat-sub-btn{padding:6px 12px;border-radius:8px;border:1.5px solid #dee2e6;background:transparent;cursor:pointer;font-size:12px;color:#666;font-weight:500;white-space:nowrap}
.stat-sub-btn.active{background:#111;color:#fff;border-color:#111}
.team-stat-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.team-stat-name{font-size:13px;color:#333;width:60px;flex-shrink:0;font-weight:500}
.team-stat-bar-wrap{flex:1;height:8px;background:#e9ecef;border-radius:4px;overflow:hidden}
.team-stat-bar{height:100%;border-radius:4px;transition:width 0.4s}
.team-stat-count{font-size:12px;color:#888;width:36px;text-align:right}
.bottom-nav{border-top:1px solid #f1f3f5;padding:10px 0 0;display:flex;justify-content:space-around;margin-top:2rem}
.nav-item{flex:1;padding:8px 4px;border-radius:10px;border:none;background:none;cursor:pointer;font-size:11px;color:#999;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:500}
.nav-item i{font-size:20px}
.nav-item.active{color:#111;background:#f1f3f5}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:999;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;padding:1.5rem;width:300px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,0.15)}
.modal h3{font-size:17px;font-weight:600;color:#111;margin-bottom:6px}
.modal p{font-size:13px;color:#888;margin-bottom:1.2rem}
.heart-team-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1rem}
.heart-team-btn{padding:12px 6px;border-radius:10px;border:none;cursor:pointer;font-size:13px;font-weight:600;color:#fff;text-align:center;transition:all 0.15s;opacity:0.85}
.heart-team-btn:hover{opacity:1;transform:translateY(-1px)}
.heart-team-btn.blue{background:#1a87c8}
.heart-team-btn.red{background:#e8472a}
.heart-team-btn:disabled{opacity:0.3;cursor:not-allowed;transform:none}
.topic-badge{display:inline-block;padding:6px 12px;border-radius:8px;background:#f1f3f5;font-size:13px;font-weight:600;color:#555;margin-bottom:14px}
.selected-team-info{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:10px;font-size:14px;font-weight:600;color:#fff;margin-bottom:14px}
.auto-title-hint{font-size:12px;color:#888;margin-bottom:6px;display:flex;align-items:center;gap:4px}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- 의견 제출 뷰 -->
  <div class="view active" id="view-submit">
    <div class="logo">
      <span class="dot" id="conn-dot"></span>
      <span id="conn-label">연결 중...</span>
    </div>
    <div class="banner">
      <img src="banner.png" alt="스마일멘토 시즌5">
    </div>

    <!-- 접수 중단 배너 -->
    <div id="closed-banner" style="display:none;background:#fff8e1;border:1.5px solid #ffe082;border-radius:12px;padding:1.5rem;text-align:center;margin-bottom:1.2rem">
      <div style="font-size:36px;margin-bottom:8px">🧃</div>
      <div style="font-size:16px;font-weight:500;color:#7c5700;margin-bottom:4px">지금은 활동에 집중할 시간!</div>
      <div style="font-size:14px;color:#a07020">의견 접수를 잠깐 멈춰주세요!</div>
    </div>

    <!-- 통합 제출 폼 -->
    <div id="step-form">
      <div class="page-title">함께 나누고 싶은 의견을 작성해주세요!</div>
      <div class="page-sub">팀을 선택하고 의견을 입력해주세요</div>

      <!-- 팀 선택 -->
      <div class="section-label">팀 선택 <span class="required">필수</span></div>
      <div class="team-grid" id="team-grid"></div>

      <!-- 제목 (자동/직접입력) -->
      <div class="section-label">제목 <span class="required">필수</span></div>
      <div id="auto-title-hint" class="auto-title-hint" style="display:none">
        <i class="ti ti-sparkles" style="font-size:13px;color:#1a87c8"></i>
        <span id="auto-title-hint-text">주제가 자동으로 입력되었습니다</span>
      </div>
      <input type="text" class="input-title" id="opinion-title" placeholder="의견 제목을 입력해주세요" maxlength="50">
      <div class="char-count"><span id="title-num">0</span> / 50</div>
      <div class="field-gap"></div>

      <!-- 내용 -->
      <div class="section-label">내용 <span class="required">필수</span></div>
      <textarea class="input-area" id="opinion-text" placeholder="자유롭게 의견을 작성해주세요..." maxlength="300"></textarea>
      <div class="char-count"><span id="char-num">0</span> / 300</div>

      <div class="submit-row">
        <button class="btn btn-primary" style="width:100%" id="submit-btn" disabled>
          <i class="ti ti-send"></i> 의견 제출하기
        </button>
      </div>
    </div>

    <!-- 제출 완료 -->
    <div id="step-done" style="display:none">
      <div class="success-wrap">
        <div class="success-icon"><i class="ti ti-circle-check"></i></div>
        <h2>의견이 제출되었습니다</h2>
        <p id="done-sub"></p>
        <button class="btn btn-primary" id="reset-btn"><i class="ti ti-plus"></i> 추가 의견 제출</button>
      </div>
    </div>

    <div class="bottom-nav">
      <button class="nav-item active" data-nav="submit"><i class="ti ti-pencil"></i><span>의견 제출</span></button>
      <button class="nav-item" data-nav="feed"><i class="ti ti-messages"></i><span>의견 살펴보기</span></button>
      <button class="nav-item" data-nav="stats"><i class="ti ti-chart-bar"></i><span>참여현황</span></button>
    </div>
  </div>

  <!-- 의견 살펴보기 뷰 -->
  <div class="view" id="view-feed">
    <div class="feed-header">
      <div class="page-title" style="margin-bottom:0">의견 살펴보기</div>
    </div>
    <div class="filter-scroll">
      <div class="filter-row" id="filter-row"></div>
    </div>
    <div class="feed" id="feed"></div>
    <div class="bottom-nav">
      <button class="nav-item" data-nav="submit"><i class="ti ti-pencil"></i><span>의견 제출</span></button>
      <button class="nav-item active" data-nav="feed"><i class="ti ti-messages"></i><span>의견 살펴보기</span></button>
      <button class="nav-item" data-nav="stats"><i class="ti ti-chart-bar"></i><span>참여현황</span></button>
    </div>
  </div>

  <!-- 참여현황 뷰 -->
  <div class="view" id="view-stats">
    <div class="page-title" style="margin-bottom:1rem">참여현황</div>
    <div class="stats-top">
      <div class="stat-card">
        <div class="stat-num" id="total-count">0</div>
        <div class="stat-label">전체 의견 수</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="total-hearts">0</div>
        <div class="stat-label">전체 하트 수</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="total-participation">0</div>
        <div class="stat-label">전체 참여 수</div>
      </div>
    </div>
    <div class="stat-sub-tabs" style="overflow-x:auto;white-space:nowrap;padding-bottom:4px;flex-wrap:nowrap">
      <button class="stat-sub-btn active" id="sub-opinion-btn">팀별 의견</button>
      <button class="stat-sub-btn" id="sub-heart-btn">팀별 하트</button>
      <button class="stat-sub-btn" id="sub-participation-btn">팀별 참여</button>
      <button class="stat-sub-btn" id="sub-ranking-btn">🍦 순위표</button>
      <button class="stat-sub-btn" id="sub-topic-btn">📋 주제별 순위</button>
    </div>
    <div id="stat-detail"></div>
    <div class="bottom-nav">
      <button class="nav-item" data-nav="submit"><i class="ti ti-pencil"></i><span>의견 제출</span></button>
      <button class="nav-item" data-nav="feed"><i class="ti ti-messages"></i><span>의견 살펴보기</span></button>
      <button class="nav-item active" data-nav="stats"><i class="ti ti-chart-bar"></i><span>참여현황</span></button>
    </div>
  </div>
</div>

<!-- 하트 팀 선택 모달 -->
<div class="modal-overlay" id="heart-modal">
  <div class="modal">
    <h3>❤️ 우리 팀은?</h3>
    <p>하트를 누를 팀을 선택하세요</p>
    <div class="heart-team-grid" id="heart-team-grid"></div>
    <button style="width:100%;padding:10px;border-radius:8px;border:none;cursor:pointer;font-size:14px;font-weight:500;background:#f1f3f5;color:#666" id="heart-cancel-btn">취소</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getDatabase, ref, push, onValue, onChildAdded, onChildChanged, onChildRemoved, runTransaction } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyD6TOv4ro8LGNDUfrmeXz5YOf6CYc7dbR0",
  authDomain: "smilementor5.firebaseapp.com",
  databaseURL: "https://smilementor5-default-rtdb.firebaseio.com/",
  projectId: "smilementor5",
  storageBucket: "smilementor5.firebasestorage.app",
  messagingSenderId: "549089219419",
  appId: "1:549089219449:web:152ed19b16dfd6cbb3407e"
};

const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);
const opinionsRef = ref(db, 'opinions');
const activeRef = ref(db, 'settings/active');
const questionRef = ref(db, 'settings/question');

const TEAMS = ['Team1','Team2','Team3','Team4','Team5','Team6','Team7','Team8','Team9','Team10','Team11'];
const TEAM_COLOR = i => i < 4 ? 'blue' : 'red';
const BAR_COLOR = i => i < 4 ? '#1a87c8' : '#e8472a';

const TOPICS = ['응원메시지자랑','우리가꿈꾸는활동','재미있는활동아이디어','자유입력'];

function getLikedMap() {
  try { return JSON.parse(localStorage.getItem('sm5_liked') || '{}'); } catch { return {}; }
}
function setLiked(key, teamIdx) {
  const m = getLikedMap(); m[key] = teamIdx;
  localStorage.setItem('sm5_liked', JSON.stringify(m));
}

let opinions = [];
let selectedTeam = null;
let currentFilter = 'all';
let pendingHeartKey = null;
let currentStatTab = 'opinion';
let isActive = true;
let currentQuestion = '자유입력';

// 연결 상태
function setConnected(ok) {
  document.getElementById('conn-dot').className = 'dot' + (ok ? ' connected' : '');
  document.getElementById('conn-label').textContent = ok ? 'Firebase 연결됨' : '연결 중...';
}

// 네비게이션
function switchView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  document.querySelectorAll('[data-nav]').forEach(b => b.classList.toggle('active', b.dataset.nav === name));
  if (name === 'stats') renderStats();
  if (name === 'feed') renderFeed();
}

document.querySelectorAll('[data-nav]').forEach(btn => {
  btn.addEventListener('click', () => switchView(btn.dataset.nav));
});

// 팀 버튼
const grid = document.getElementById('team-grid');
TEAMS.forEach((t, i) => {
  const b = document.createElement('button');
  b.className = 'team-btn ' + TEAM_COLOR(i);
  b.textContent = t;
  b.addEventListener('click', () => {
    document.querySelectorAll('.team-btn').forEach(x => x.classList.remove('selected'));
    b.classList.add('selected');
    selectedTeam = i;
    updateSubmitBtn();
  });
  grid.appendChild(b);
});

// 하트 팀 버튼
const heartGrid = document.getElementById('heart-team-grid');
TEAMS.forEach((t, i) => {
  const b = document.createElement('button');
  b.className = 'heart-team-btn ' + TEAM_COLOR(i);
  b.textContent = t;
  b.dataset.teamIdx = i;
  heartGrid.appendChild(b);
});

// 입력 이벤트
document.getElementById('opinion-title').addEventListener('input', () => {
  document.getElementById('title-num').textContent = document.getElementById('opinion-title').value.length;
  updateSubmitBtn();
});
document.getElementById('opinion-text').addEventListener('input', () => {
  document.getElementById('char-num').textContent = document.getElementById('opinion-text').value.length;
  updateSubmitBtn();
});

function updateSubmitBtn() {
  const t = document.getElementById('opinion-title').value.trim();
  const c = document.getElementById('opinion-text').value.trim();
  document.getElementById('submit-btn').disabled = (selectedTeam === null || t.length === 0 || c.length === 0);
}

// 질문 주제 변경 시 제목 자동입력
function applyQuestion(q) {
  currentQuestion = q || '자유입력';
  const titleInput = document.getElementById('opinion-title');
  const hint = document.getElementById('auto-title-hint');
  const hintText = document.getElementById('auto-title-hint-text');
  if (currentQuestion === '자유입력') {
    titleInput.readOnly = false;
    titleInput.classList.add('editable');
    titleInput.placeholder = '의견 제목을 직접 입력해주세요';
    if (titleInput.dataset.autoFilled === 'true') {
      titleInput.value = '';
      titleInput.dataset.autoFilled = 'false';
      document.getElementById('title-num').textContent = '0';
    }
    hint.style.display = 'none';
  } else {
    titleInput.readOnly = true;
    titleInput.classList.remove('editable');
    titleInput.value = currentQuestion;
    titleInput.dataset.autoFilled = 'true';
    document.getElementById('title-num').textContent = currentQuestion.length;
    hintText.textContent = `"${currentQuestion}" 주제로 자동 설정되었습니다`;
    hint.style.display = 'flex';
  }
  updateSubmitBtn();
}

// 제출
document.getElementById('submit-btn').addEventListener('click', async () => {
  const title = document.getElementById('opinion-title').value.trim();
  const text = document.getElementById('opinion-text').value.trim();
  if (!title || !text || selectedTeam === null) return;
  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader" style="animation:spin 1s linear infinite"></i> 전송 중...';
  try {
    await push(opinionsRef, {
      team: selectedTeam,
      title,
      topic: currentQuestion,
      text,
      time: Date.now(),
      hearts: {}
    });
    document.getElementById('step-form').style.display = 'none';
    document.getElementById('step-done').style.display = 'block';
    document.getElementById('done-sub').textContent = `${TEAMS[selectedTeam]}의 의견이 전송되었습니다`;
    document.getElementById('opinion-title').value = '';
    document.getElementById('opinion-text').value = '';
    document.getElementById('opinion-title').dataset.autoFilled = 'false';
    document.getElementById('title-num').textContent = '0';
    document.getElementById('char-num').textContent = '0';
  } catch(e) {
    alert('전송 실패: ' + e.message);
    btn.disabled = false;
    btn.innerHTML = '<i class="ti ti-send"></i> 의견 제출하기';
  }
});

document.getElementById('reset-btn').addEventListener('click', () => {
  selectedTeam = null;
  document.querySelectorAll('.team-btn').forEach(b => b.classList.remove('selected'));
  document.getElementById('step-done').style.display = 'none';
  document.getElementById('step-form').style.display = 'block';
  applyQuestion(currentQuestion);
  updateSubmitBtn();
});

// 피드 이벤트 위임
document.getElementById('feed').addEventListener('click', e => {
  const heartBtn = e.target.closest('[data-heart-key]');
  if (heartBtn && !heartBtn.classList.contains('liked')) {
    if (!isActive) return; // 접수 중단 시 하트 비활성화
    pendingHeartKey = heartBtn.dataset.heartKey;
    openHeartModal();
  }
});

// 하트 모달
function openHeartModal() {
  document.querySelectorAll('.heart-team-btn').forEach(b => b.disabled = false);
  document.getElementById('heart-modal').classList.add('show');
}

document.getElementById('heart-cancel-btn').addEventListener('click', () => {
  document.getElementById('heart-modal').classList.remove('show');
  pendingHeartKey = null;
});

document.getElementById('heart-team-grid').addEventListener('click', async e => {
  const btn = e.target.closest('.heart-team-btn');
  if (!btn || btn.disabled) return;
  const teamIdx = parseInt(btn.dataset.teamIdx);
  document.getElementById('heart-modal').classList.remove('show');
  if (!pendingHeartKey) return;
  try {
    const heartRef = ref(db, `opinions/${pendingHeartKey}/hearts/${teamIdx}`);
    await runTransaction(heartRef, current => {
      if (current !== null) return;
      return true;
    });
    setLiked(pendingHeartKey, teamIdx);
    renderFeed();
  } catch(e) { alert('하트 처리 실패: ' + e.message); }
  pendingHeartKey = null;
});

// 필터 (주제별)
const FILTER_TOPICS = [
  { key: 'all', label: '전체' },
  { key: '응원메시지자랑', label: '응원메시지자랑' },
  { key: '우리가꿈꾸는활동', label: '우리가꿈꾸는활동' },
  { key: '재미있는활동아이디어', label: '재미있는활동아이디어' },
  { key: '자유입력', label: '자유입력' },
];

function buildFilters() {
  const row = document.getElementById('filter-row');
  let html = '';
  FILTER_TOPICS.forEach(ft => {
    const cnt = ft.key === 'all' ? opinions.length : opinions.filter(o => (o.topic || '자유입력') === ft.key).length;
    if (ft.key !== 'all' && cnt === 0) return;
    html += `<span class="filter-chip ${currentFilter === ft.key ? 'active' : ''}" data-filter="${ft.key}">${ft.label} ${cnt}</span>`;
  });
  row.innerHTML = html;
}

document.querySelector('.filter-scroll').addEventListener('click', e => {
  const chip = e.target.closest('[data-filter]');
  if (!chip) return;
  currentFilter = chip.dataset.filter;
  renderFeed();
});

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function heartCount(hearts) {
  if (!hearts) return 0;
  return Object.values(hearts).filter(v => v === true).length;
}

function renderFeed() {
  const feed = document.getElementById('feed');

  // 하트 TOP3 계산 (하트 1개 이상인 것만)
  const hotKeys = [...opinions]
    .filter(op => heartCount(op.hearts) > 0)
    .sort((a,b) => heartCount(b.hearts) - heartCount(a.hearts))
    .slice(0,3)
    .map(op => op.key);

  if (opinions.length === 0) {
    feed.innerHTML = '<div class="empty-feed"><i class="ti ti-inbox"></i>아직 제출된 의견이 없습니다</div>';
    buildFilters(); return;
  }

  // 순서: HOT TOP3 먼저, 그 다음 나머지 최신순
  const hotOps = hotKeys.map(k => opinions.find(o => o.key === k)).filter(Boolean);
  const restOps = opinions.filter(op => !hotKeys.includes(op.key));

  let html = '';
  if (hotOps.length > 0) {
    hotOps.forEach((op, i) => {
      const rank = i + 1;
      const visible = cardVisible(op);
      html += `<div class="opinion-card hot-${rank}" data-key="${op.key}" style="${visible?'':'display:none'}">${cardHTML(op, rank)}</div>`;
    });
    html += '<hr class="hot-divider">';
  }
  restOps.forEach(op => {
    const visible = cardVisible(op);
    html += `<div class="opinion-card" data-key="${op.key}" style="${visible?'':'display:none'}">${cardHTML(op, 0)}</div>`;
  });

  feed.innerHTML = html;
  checkEmpty();
  buildFilters();
}

// 참여현황
function renderStats() {
  const totalH = opinions.reduce((sum, op) => sum + heartCount(op.hearts), 0);
  const totalP = opinions.reduce((sum, op) => {
    return sum + (op.hearts ? Object.values(op.hearts).filter(v => v === true).length : 0);
  }, 0);
  document.getElementById('total-count').textContent = opinions.length;
  document.getElementById('total-hearts').textContent = totalH;
  document.getElementById('total-participation').textContent = totalP;
  renderStatDetail();
}

document.getElementById('sub-opinion-btn').addEventListener('click', () => setStatTab('opinion'));
document.getElementById('sub-heart-btn').addEventListener('click', () => setStatTab('heart'));
document.getElementById('sub-participation-btn').addEventListener('click', () => setStatTab('participation'));
document.getElementById('sub-ranking-btn').addEventListener('click', () => setStatTab('ranking'));
document.getElementById('sub-topic-btn').addEventListener('click', () => setStatTab('topic'));

function setStatTab(tab) {
  currentStatTab = tab;
  ['opinion','heart','participation','ranking','topic'].forEach(t => {
    document.getElementById(`sub-${t}-btn`).classList.toggle('active', t === tab);
  });
  renderStatDetail();
}

function renderStatDetail() {
  const el = document.getElementById('stat-detail');
  if (currentStatTab === 'opinion') {
    const counts = TEAMS.map((_,i) => opinions.filter(o=>o.team===i).length);
    const max = Math.max(...counts, 1);
    el.innerHTML = TEAMS.map((t,i) => `
      <div class="team-stat-row">
        <span class="team-stat-name">${t}</span>
        <div class="team-stat-bar-wrap"><div class="team-stat-bar" style="width:${Math.round(counts[i]/max*100)}%;background:${BAR_COLOR(i)}"></div></div>
        <span class="team-stat-count">${counts[i]}</span>
      </div>`).join('');
  } else if (currentStatTab === 'heart') {
    const counts = TEAMS.map((_,i) => opinions.filter(o=>o.team===i).reduce((s,op)=>s+heartCount(op.hearts),0));
    const max = Math.max(...counts, 1);
    el.innerHTML = TEAMS.map((t,i) => `
      <div class="team-stat-row">
        <span class="team-stat-name">${t}</span>
        <div class="team-stat-bar-wrap"><div class="team-stat-bar" style="width:${Math.round(counts[i]/max*100)}%;background:${BAR_COLOR(i)}"></div></div>
        <span class="team-stat-count">❤️${counts[i]}</span>
      </div>`).join('');
  } else if (currentStatTab === 'participation') {
    const counts = TEAMS.map((_,i) =>
      opinions.reduce((sum, op) => sum + (op.hearts && op.hearts[i] === true ? 1 : 0), 0)
    );
    const max = Math.max(...counts, 1);
    el.innerHTML = TEAMS.map((t,i) => `
      <div class="team-stat-row">
        <span class="team-stat-name">${t}</span>
        <div class="team-stat-bar-wrap"><div class="team-stat-bar" style="width:${Math.round(counts[i]/max*100)}%;background:${BAR_COLOR(i)}"></div></div>
        <span class="team-stat-count">${counts[i]}</span>
      </div>`).join('');
  } else if (currentStatTab === 'ranking') {
    const scores = TEAMS.map((_,i) => {
      const opinionScore = opinions.filter(o=>o.team===i).length * 5;
      const heartReceived = opinions.filter(o=>o.team===i).reduce((s,op)=>s+heartCount(op.hearts),0) * 2;
      const heartGiven = opinions.reduce((sum,op)=>sum+(op.hearts&&op.hearts[i]===true?1:0),0) * 1;
      return { idx: i, score: opinionScore + heartReceived + heartGiven };
    });
    const sorted = [...scores].sort((a,b) => b.score - a.score);
    const groups = [
      sorted.slice(0,2), sorted.slice(2,4), sorted.slice(4,6), sorted.slice(6,8), sorted.slice(8,11)
    ];
    el.innerHTML = `
      <div style="text-align:center;font-size:15px;font-weight:500;color:#111;margin-bottom:1.2rem">🍦 아이스크림 먼저 골라볼게요!</div>
      ${groups.map(group => `
        <div style="display:flex;gap:10px;justify-content:center;margin-bottom:12px;flex-wrap:wrap">
          ${group.map(({idx}) => `
            <button style="padding:14px 10px;border-radius:12px;border:none;cursor:default;font-size:14px;font-weight:600;color:#fff;background:${BAR_COLOR(idx)};min-width:72px;opacity:0.9">
              ${TEAMS[idx]}
            </button>`).join('')}
        </div>`).join('')}`;

  } else if (currentStatTab === 'topic') {
    const TOPICS = ['응원메시지자랑','우리가꿈꾸는활동','재미있는활동아이디어','자유입력'];
    const TOPIC_EMOJI = ['📣','🌟','💡','✏️'];
    const MEDAL = ['🥇','🥈','🥉'];

    let html = '';
    TOPICS.forEach((topic, ti) => {
      const topicOps = opinions.filter(o => (o.topic || '자유입력') === topic);
      if (topicOps.length === 0) {
        html += `<div class="topic-rank-section">
          <div class="topic-rank-title">${TOPIC_EMOJI[ti]} ${topic}</div>
          <div style="font-size:13px;color:#aaa;padding:10px 0 14px">아직 의견이 없습니다</div>
        </div>`;
        return;
      }
      // 팀별 하트 합산
      const teamHearts = TEAMS.map((_,i) =>
        topicOps.filter(o=>o.team===i).reduce((s,op)=>s+heartCount(op.hearts),0)
      );
      const ranked = TEAMS
        .map((t,i) => ({ idx:i, name:t, hearts: teamHearts[i] }))
        .filter(t => t.hearts > 0)
        .sort((a,b) => b.hearts - a.hearts)
        .slice(0,3);

      const rows = ranked.map((t,ri) => `
        <div class="topic-rank-row">
          <span class="topic-rank-medal">${MEDAL[ri]}</span>
          <span class="topic-rank-team-tag ${TEAM_COLOR(t.idx)}">${t.name}</span>
          <div class="topic-rank-bar-wrap">
            <div class="topic-rank-bar" style="width:${Math.round(t.hearts/ranked[0].hearts*100)}%;background:${BAR_COLOR(t.idx)}"></div>
          </div>
          <span class="topic-rank-hearts">❤️${t.hearts}</span>
        </div>`).join('');

      html += `<div class="topic-rank-section">
        <div class="topic-rank-title">${TOPIC_EMOJI[ti]} ${topic}</div>
        ${rows || '<div style="font-size:13px;color:#aaa;padding:6px 0">하트가 없습니다</div>'}
      </div>`;
    });
    el.innerHTML = html;
  }
}

// ── 카드 HTML 생성 ───────────────────────────────────────
function cardHTML(op, hotRank) {
  const color = TEAM_COLOR(op.team);
  const t = new Date(op.time).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
  const hCount = heartCount(op.hearts);
  const liked = getLikedMap()[op.key] !== undefined;
  const topicLabel = op.topic || '자유입력';
  const badgeMap = {1:'🥇 인기 1위', 2:'🥈 인기 2위', 3:'🥉 인기 3위'};
  const badge = hotRank && badgeMap[hotRank] ? `<span class="hot-badge">${badgeMap[hotRank]}</span>` : '';
  return `${badge}<div class="card-meta">
      <div class="card-meta-left">
        <span class="team-tag ${color}">${TEAMS[op.team]}</span>
        <span class="topic-tag">${escapeHtml(topicLabel)}</span>
      </div>
      <span class="card-time">${t}</span>
    </div>
    ${op.title && op.title !== topicLabel ? `<div class="card-title-text">${escapeHtml(op.title)}</div>` : ''}
    <div class="card-text">${escapeHtml(op.text)}</div>
    <div class="card-footer">
      <button class="heart-btn${liked?' liked':''}" data-heart-key="${op.key}">
        ❤️ ${hCount}${liked?' (눌렀음)':''}
      </button>
    </div>`;
}

// 카드가 현재 필터에 보여야 하는지
function cardVisible(op) {
  return currentFilter === 'all' || (op.topic || '자유입력') === currentFilter;
}

// 빈 상태 체크
function checkEmpty() {
  const feed = document.getElementById('feed');
  const visible = [...feed.querySelectorAll('.opinion-card')].filter(el => el.style.display !== 'none');
  let empty = feed.querySelector('.empty-feed');
  if (visible.length === 0) {
    if (!empty) {
      empty = document.createElement('div');
      empty.className = 'empty-feed';
      empty.innerHTML = '<i class="ti ti-inbox"></i>아직 제출된 의견이 없습니다';
      feed.appendChild(empty);
    }
  } else {
    if (empty) empty.remove();
  }
}

// ── Firebase 리스너 (child 단위) ─────────────────────────
let initialLoadDone = false;

onChildAdded(opinionsRef, child => {
  setConnected(true);
  const op = { key: child.key, ...child.val() };

  // opinions 배열 앞에 추가 (최신순)
  opinions.unshift(op);

  // 초기 로딩 중에는 DOM 직접 조작하지 않음 (아래 onValue에서 한번에 처리)
  if (!initialLoadDone) return;

  // 새 카드 DOM 추가
  const feed = document.getElementById('feed');
  feed.querySelector('.empty-feed')?.remove();

  const el = document.createElement('div');
  el.className = 'opinion-card';
  el.dataset.key = op.key;
  el.style.display = cardVisible(op) ? '' : 'none';
  el.innerHTML = cardHTML(op);
  feed.prepend(el);

  buildFilters();
  updateStatNumbers();
});

onChildChanged(opinionsRef, child => {
  const op = { key: child.key, ...child.val() };
  const idx = opinions.findIndex(o => o.key === op.key);
  if (idx !== -1) opinions[idx] = op;

  // 해당 카드의 하트 버튼만 조용히 업데이트 (번쩍임 없음)
  // TOP3 재배치는 새로고침 시 반영
  const el = document.querySelector(`.opinion-card[data-key="${op.key}"]`);
  if (el) {
    const hCount = heartCount(op.hearts);
    const liked = getLikedMap()[op.key] !== undefined;
    const btn = el.querySelector('.heart-btn');
    if (btn) {
      btn.textContent = '';
      btn.innerHTML = `❤️ ${hCount}${liked?' (눌렀음)':''}`;
    }
  }
  updateStatNumbers();
});

onChildRemoved(opinionsRef, child => {
  opinions = opinions.filter(o => o.key !== child.key);
  const el = document.querySelector(`.opinion-card[data-key="${child.key}"]`);
  if (el) el.remove();
  checkEmpty();
  buildFilters();
  updateStatNumbers();
});

// 초기 전체 로드 (한 번만)
onValue(opinionsRef, snapshot => {
  if (initialLoadDone) return;
  initialLoadDone = true;
  setConnected(true);
  opinions = [];
  snapshot.forEach(child => {
    opinions.unshift({ key: child.key, ...child.val() });
  });
  renderFeed(); // 최초 1회 전체 렌더
}, { onlyOnce: true });

function updateStatNumbers() {
  if (document.getElementById('view-stats').classList.contains('active')) renderStats();
}

onValue(activeRef, snapshot => {
  const active = snapshot.val() !== false;
  isActive = active;
  const banner = document.getElementById('closed-banner');
  const form = document.getElementById('step-form');
  const done = document.getElementById('step-done');
  if (active) {
    banner.style.display = 'none';
    if (done.style.display === 'none') form.style.display = 'block';
    document.getElementById('feed').classList.remove('inactive');
  } else {
    banner.style.display = 'block';
    form.style.display = 'none';
    document.getElementById('feed').classList.add('inactive');
  }
});

onValue(questionRef, snapshot => {
  const q = snapshot.val() || '자유입력';
  applyQuestion(q);
});
</script>

@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
</style>
