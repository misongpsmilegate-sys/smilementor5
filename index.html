<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스마일멘토 시즌5</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8f9fa;min-height:100vh}
.app{max-width:480px;margin:0 auto;padding:1.5rem;min-height:100vh;background:#fff;position:relative}
.view{display:none}.view.active{display:block}
.logo{font-size:13px;color:#888;margin-bottom:1.2rem;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#ccc;display:inline-block;flex-shrink:0}
.dot.connected{background:#22c55e}
.banner{width:100%;border-radius:12px;overflow:hidden;margin-bottom:1.2rem}
.banner img{width:100%;display:block}
.page-title{font-size:20px;font-weight:600;color:#111;margin-bottom:6px}
.page-sub{font-size:15px;color:#666;margin-bottom:1.5rem}
.btn{display:inline-flex;align-items:center;gap:6px;padding:12px 20px;border-radius:10px;border:none;cursor:pointer;font-size:15px;font-weight:500;transition:opacity 0.15s;justify-content:center}
.btn:hover{opacity:0.85}
.btn:disabled{opacity:0.4;cursor:not-allowed}
.btn-primary{background:#111;color:#fff}
.btn-secondary{background:#f1f3f5;color:#111;border:1px solid #ddd}
.btn-sm{padding:8px 14px;font-size:13px}
.team-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.5rem}
.team-btn{padding:16px 8px;border-radius:12px;border:none;cursor:pointer;font-size:14px;font-weight:600;color:#fff;text-align:center;transition:all 0.15s;opacity:0.85}
.team-btn:hover{opacity:1;transform:translateY(-1px)}
.team-btn.selected{outline:3px solid #111;outline-offset:2px;opacity:1;transform:translateY(-1px)}
.team-btn.blue{background:#1a87c8}
.team-btn.red{background:#e8472a}
.field-label{font-size:13px;font-weight:600;color:#444;margin-bottom:6px}
.input-title{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid #dee2e6;background:#fff;color:#111;font-size:15px;font-family:inherit;outline:none;line-height:1.5}
.input-title:focus{border-color:#666}
.input-area{width:100%;min-height:110px;padding:12px 14px;border-radius:10px;border:1.5px solid #dee2e6;background:#fff;color:#111;font-size:15px;font-family:inherit;resize:vertical;outline:none;line-height:1.6}
.input-area:focus{border-color:#666}
.char-count{font-size:12px;color:#aaa;text-align:right;margin-top:4px}
.field-gap{height:14px}
.submit-row{display:flex;align-items:center;justify-content:space-between;margin-top:1.2rem}
.success-wrap{text-align:center;padding:3rem 1rem}
.success-icon{font-size:52px;color:#22c55e;margin-bottom:1rem}
.success-wrap h2{font-size:20px;font-weight:600;margin-bottom:8px;color:#111}
.success-wrap p{color:#666;font-size:14px;margin-bottom:2rem}
.admin-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem}
.tab-row{display:flex;gap:6px}
.tab-btn{padding:7px 16px;border-radius:8px;border:1.5px solid #dee2e6;background:transparent;cursor:pointer;font-size:13px;color:#666;font-weight:500}
.tab-btn.active{background:#111;color:#fff;border-color:#111}
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem}
.filter-chip{padding:5px 12px;border-radius:20px;border:1.5px solid #dee2e6;background:#f8f9fa;font-size:12px;color:#666;cursor:pointer;font-weight:500}
.filter-chip.active{background:#111;color:#fff;border-color:#111}
.feed{display:flex;flex-direction:column;gap:10px}
.opinion-card{padding:14px 16px;border-radius:12px;background:#f8f9fa;border:1px solid #e9ecef;animation:slideIn 0.3s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.card-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.team-tag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:6px;color:#fff}
.team-tag.blue{background:#1a87c8}
.team-tag.red{background:#e8472a}
.card-right{display:flex;align-items:center;gap:8px}
.card-time{font-size:11px;color:#aaa}
.card-del{border:none;background:none;cursor:pointer;color:#ccc;font-size:16px;padding:2px 4px;border-radius:4px}
.card-del:hover{color:#ef4444}
.card-title-text{font-size:14px;font-weight:600;color:#111;margin-bottom:4px}
.card-text{font-size:14px;color:#444;line-height:1.7;margin-bottom:10px}
.card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.heart-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;border:1.5px solid #fecdd3;background:#fff5f5;cursor:pointer;font-size:13px;color:#e8472a;font-weight:500;transition:all 0.15s}
.heart-btn:hover{background:#ffe4e6}
.heart-btn.liked{background:#e8472a;color:#fff;border-color:#e8472a}
.heart-teams{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.heart-team-chip{font-size:11px;padding:2px 7px;border-radius:10px;font-weight:500;color:#fff}
.heart-team-chip.blue{background:#1a87c8}
.heart-team-chip.red{background:#e8472a}
.empty-feed{text-align:center;padding:3rem;color:#aaa;font-size:14px}
.empty-feed i{font-size:36px;display:block;margin-bottom:10px}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:1.5rem}
.stat-card{padding:16px;border-radius:12px;background:#f8f9fa;border:1px solid #e9ecef}
.stat-num{font-size:32px;font-weight:700;color:#111}
.stat-label{font-size:12px;color:#888;margin-top:2px}
.team-stat-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.team-stat-name{font-size:13px;color:#333;width:60px;flex-shrink:0;font-weight:500}
.team-stat-bar-wrap{flex:1;height:8px;background:#e9ecef;border-radius:4px;overflow:hidden}
.team-stat-bar{height:100%;border-radius:4px;transition:width 0.4s}
.team-stat-count{font-size:12px;color:#888;width:30px;text-align:right}
.bottom-nav{border-top:1px solid #f1f3f5;padding:12px 0 0;display:flex;gap:4px;justify-content:center;margin-top:2rem}
.nav-item{padding:8px 20px;border-radius:10px;border:none;background:none;cursor:pointer;font-size:12px;color:#999;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:500}
.nav-item i{font-size:20px}
.nav-item.active{color:#111;background:#f1f3f5}
.clear-btn{font-size:12px;color:#ef4444;background:none;border:1px solid #fecaca;border-radius:6px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.clear-btn:hover{background:#fff5f5}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:999;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;padding:1.5rem;width:300px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,0.15)}
.modal h3{font-size:17px;font-weight:600;color:#111;margin-bottom:6px}
.modal p{font-size:13px;color:#888;margin-bottom:1.2rem}
.pw-input{width:100%;padding:11px 14px;border-radius:10px;border:1.5px solid #dee2e6;font-size:20px;text-align:center;letter-spacing:8px;outline:none;color:#111;font-family:inherit;margin-bottom:8px}
.pw-input:focus{border-color:#666}
.pw-error{font-size:12px;color:#ef4444;margin-bottom:10px;min-height:18px}
.modal-btns{display:flex;gap:8px}
.modal-btns button{flex:1;padding:10px;border-radius:8px;border:none;cursor:pointer;font-size:14px;font-weight:500}
.modal-cancel{background:#f1f3f5;color:#666}
.modal-confirm{background:#111;color:#fff}
.heart-team-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1rem}
.heart-team-btn{padding:12px 6px;border-radius:10px;border:none;cursor:pointer;font-size:13px;font-weight:600;color:#fff;text-align:center;transition:all 0.15s;opacity:0.85}
.heart-team-btn:hover{opacity:1;transform:translateY(-1px)}
.heart-team-btn.blue{background:#1a87c8}
.heart-team-btn.red{background:#e8472a}
.heart-team-btn:disabled{opacity:0.3;cursor:not-allowed;transform:none}
</style>
</head>
<body>

<div class="app" id="app">
  <div class="view active" id="view-submit">
    <div class="logo">
      <span class="dot" id="conn-dot"></span>
      <span id="conn-label">연결 중...</span>
    </div>
    <div class="banner">
      <img src="banner.png" alt="스마일멘토 시즌5">
    </div>
    <div id="step-team">
      <div class="page-title">함께 나누고 싶은 의견을 작성해주세요!</div>
      <div class="page-sub">팀을 선택한 후 의견을 입력해주세요</div>
      <div class="team-grid" id="team-grid"></div>
      <button class="btn btn-primary" style="width:100%" id="next-btn" disabled>
        <i class="ti ti-arrow-right"></i> 다음
      </button>
    </div>
    <div id="step-input" style="display:none">
      <div class="page-title">의견을 입력해주세요</div>
      <div class="page-sub" id="input-sub"></div>
      <div class="field-label">제목</div>
      <input type="text" class="input-title" id="opinion-title" placeholder="의견 제목을 입력해주세요" maxlength="50">
      <div class="char-count"><span id="title-num">0</span> / 50</div>
      <div class="field-gap"></div>
      <div class="field-label">내용</div>
      <textarea class="input-area" id="opinion-text" placeholder="자유롭게 의견을 작성해주세요..." maxlength="300"></textarea>
      <div class="char-count"><span id="char-num">0</span> / 300</div>
      <div class="submit-row">
        <button class="btn btn-secondary btn-sm" id="back-btn"><i class="ti ti-arrow-left"></i> 팀 변경</button>
        <button class="btn btn-primary" id="submit-btn" disabled><i class="ti ti-send"></i> 제출</button>
      </div>
    </div>
    <div id="step-done" style="display:none">
      <div class="success-wrap">
        <div class="success-icon"><i class="ti ti-circle-check"></i></div>
        <h2>의견이 제출되었습니다</h2>
        <p id="done-sub"></p>
        <button class="btn btn-primary" id="reset-btn"><i class="ti ti-plus"></i> 추가 의견 제출</button>
      </div>
    </div>
    <div class="bottom-nav">
      <button class="nav-item active" id="nav-submit-btn"><i class="ti ti-message-plus"></i><span>의견 제출</span></button>
      <button class="nav-item" id="nav-admin-btn"><i class="ti ti-layout-dashboard"></i><span>대시보드</span></button>
    </div>
  </div>

  <div class="view" id="view-admin">
    <div class="admin-header">
      <div class="page-title">진행자 대시보드</div>
      <div class="tab-row">
        <button class="tab-btn active" id="tab-feed-btn">피드</button>
        <button class="tab-btn" id="tab-stats-btn">통계</button>
      </div>
    </div>
    <div id="tab-feed">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <div class="filter-row" id="filter-row" style="margin-bottom:0;flex:1"></div>
        <button class="clear-btn" id="clear-all-btn">전체 삭제</button>
      </div>
      <div style="height:8px"></div>
      <div class="feed" id="feed"></div>
    </div>
    <div id="tab-stats" style="display:none">
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-num" id="total-count">0</div><div class="stat-label">전체 의견 수</div></div>
        <div class="stat-card"><div class="stat-num" id="total-hearts">0</div><div class="stat-label">전체 하트 수</div></div>
      </div>
      <div style="font-size:13px;font-weight:600;color:#444;margin-bottom:10px">팀별 의견 수</div>
      <div id="team-stats"></div>
      <div style="font-size:13px;font-weight:600;color:#444;margin:16px 0 10px">팀별 하트 수</div>
      <div id="team-heart-stats"></div>
    </div>
    <div class="bottom-nav">
      <button class="nav-item" id="nav-submit-btn2"><i class="ti ti-message-plus"></i><span>의견 제출</span></button>
      <button class="nav-item active" id="nav-admin-btn2"><i class="ti ti-layout-dashboard"></i><span>대시보드</span></button>
    </div>
  </div>
</div>

<!-- 비밀번호 모달 -->
<div class="modal-overlay" id="pw-modal">
  <div class="modal">
    <h3>🔒 비밀번호 확인</h3>
    <p id="pw-modal-desc">삭제하려면 비밀번호를 입력하세요</p>
    <input type="password" class="pw-input" id="pw-input" maxlength="10" placeholder="••••••">
    <div class="pw-error" id="pw-error"></div>
    <div class="modal-btns">
      <button class="modal-cancel" id="pw-cancel-btn">취소</button>
      <button class="modal-confirm" id="pw-confirm-btn">확인</button>
    </div>
  </div>
</div>

<!-- 하트 팀 선택 모달 -->
<div class="modal-overlay" id="heart-modal">
  <div class="modal">
    <h3>❤️ 우리 팀은?</h3>
    <p id="heart-modal-desc">하트를 누를 팀을 선택하세요</p>
    <div class="heart-team-grid" id="heart-team-grid"></div>
    <button class="modal-cancel" style="width:100%;padding:10px;border-radius:8px;border:none;cursor:pointer;font-size:14px;font-weight:500;background:#f1f3f5;color:#666" id="heart-cancel-btn">취소</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getDatabase, ref, push, onValue, remove, runTransaction, get } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyD6TOv4ro8LGNDUfrmeXz5YOf6CYc7dbR0",
  authDomain: "smilementor5.firebaseapp.com",
  databaseURL: "https://smilementor5-default-rtdb.firebaseio.com/",
  projectId: "smilementor5",
  storageBucket: "smilementor5.firebasestorage.app",
  messagingSenderId: "549089219419",
  appId: "1:549089219449:web:152ed19b16dfd6cbb3407e"
};

const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);
const opinionsRef = ref(db, 'opinions');

const TEAMS = ['Team1','Team2','Team3','Team4','Team5','Team6','Team7','Team8','Team9','Team10','Team11'];
const TEAM_COLOR = (i) => i < 4 ? 'blue' : 'red';
const BAR_COLOR = (i) => i < 4 ? '#1a87c8' : '#e8472a';
const PW = '930522';

let opinions = [];
let selectedTeam = null;
let currentFilter = 'all';
let pendingDeleteKey = null;
let pendingDeleteAll = false;
let pendingHeartKey = null;

// 연결 상태
function setConnected(ok) {
  document.getElementById('conn-dot').className = 'dot' + (ok ? ' connected' : '');
  document.getElementById('conn-label').textContent = ok ? 'Firebase 연결됨' : '연결 중...';
}

// 팀 버튼 생성
const grid = document.getElementById('team-grid');
TEAMS.forEach((t, i) => {
  const b = document.createElement('button');
  b.className = 'team-btn ' + TEAM_COLOR(i);
  b.textContent = t;
  b.addEventListener('click', () => {
    document.querySelectorAll('.team-btn').forEach(x => x.classList.remove('selected'));
    b.classList.add('selected');
    selectedTeam = i;
    document.getElementById('next-btn').disabled = false;
  });
  grid.appendChild(b);
});

// 하트 팀 버튼 생성
const heartGrid = document.getElementById('heart-team-grid');
TEAMS.forEach((t, i) => {
  const b = document.createElement('button');
  b.className = 'heart-team-btn ' + TEAM_COLOR(i);
  b.textContent = t;
  b.dataset.teamIdx = i;
  heartGrid.appendChild(b);
});

// 다음
document.getElementById('next-btn').addEventListener('click', () => {
  if (selectedTeam === null) return;
  document.getElementById('step-team').style.display = 'none';
  document.getElementById('step-input').style.display = 'block';
  const hex = TEAM_COLOR(selectedTeam) === 'blue' ? '#1a87c8' : '#e8472a';
  document.getElementById('input-sub').innerHTML = `<strong style="color:${hex}">${TEAMS[selectedTeam]}</strong>의 의견을 작성해주세요`;
  document.getElementById('opinion-title').focus();
});

document.getElementById('back-btn').addEventListener('click', () => {
  document.getElementById('step-input').style.display = 'none';
  document.getElementById('step-team').style.display = 'block';
});

document.getElementById('opinion-title').addEventListener('input', updateBtn);
document.getElementById('opinion-text').addEventListener('input', updateBtn);
function updateBtn() {
  const t = document.getElementById('opinion-title').value;
  const c = document.getElementById('opinion-text').value;
  document.getElementById('title-num').textContent = t.length;
  document.getElementById('char-num').textContent = c.length;
  document.getElementById('submit-btn').disabled = t.trim().length === 0 || c.trim().length === 0;
}

// 제출
document.getElementById('submit-btn').addEventListener('click', async () => {
  const title = document.getElementById('opinion-title').value.trim();
  const text = document.getElementById('opinion-text').value.trim();
  if (!title || !text || selectedTeam === null) return;
  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.innerHTML = '전송 중...';
  try {
    await push(opinionsRef, { team: selectedTeam, title, text, time: Date.now(), hearts: {} });
    document.getElementById('step-input').style.display = 'none';
    document.getElementById('step-done').style.display = 'block';
    document.getElementById('done-sub').textContent = `${TEAMS[selectedTeam]} 의견이 전송되었습니다`;
    document.getElementById('opinion-title').value = '';
    document.getElementById('opinion-text').value = '';
    document.getElementById('title-num').textContent = '0';
    document.getElementById('char-num').textContent = '0';
  } catch(e) {
    alert('전송 실패: ' + e.message);
    btn.disabled = false;
    btn.innerHTML = '<i class="ti ti-send"></i> 제출';
  }
});

document.getElementById('reset-btn').addEventListener('click', () => {
  selectedTeam = null;
  document.querySelectorAll('.team-btn').forEach(b => b.classList.remove('selected'));
  document.getElementById('next-btn').disabled = true;
  document.getElementById('step-done').style.display = 'none';
  document.getElementById('step-team').style.display = 'block';
});

// 네비게이션
document.getElementById('nav-admin-btn').addEventListener('click', () => {
  document.getElementById('view-submit').classList.remove('active');
  document.getElementById('view-admin').classList.add('active');
});
document.getElementById('nav-submit-btn2').addEventListener('click', () => {
  document.getElementById('view-admin').classList.remove('active');
  document.getElementById('view-submit').classList.add('active');
});

// 탭
document.getElementById('tab-feed-btn').addEventListener('click', () => {
  document.getElementById('tab-feed-btn').classList.add('active');
  document.getElementById('tab-stats-btn').classList.remove('active');
  document.getElementById('tab-feed').style.display = 'block';
  document.getElementById('tab-stats').style.display = 'none';
});
document.getElementById('tab-stats-btn').addEventListener('click', () => {
  document.getElementById('tab-stats-btn').classList.add('active');
  document.getElementById('tab-feed-btn').classList.remove('active');
  document.getElementById('tab-stats').style.display = 'block';
  document.getElementById('tab-feed').style.display = 'none';
});

// 비밀번호 모달
function openPwModal(desc) {
  document.getElementById('pw-modal-desc').textContent = desc;
  document.getElementById('pw-input').value = '';
  document.getElementById('pw-error').textContent = '';
  document.getElementById('pw-modal').classList.add('show');
  setTimeout(() => document.getElementById('pw-input').focus(), 150);
}

document.getElementById('pw-cancel-btn').addEventListener('click', () => {
  document.getElementById('pw-modal').classList.remove('show');
  pendingDeleteKey = null;
  pendingDeleteAll = false;
});

document.getElementById('pw-confirm-btn').addEventListener('click', async () => {
  const val = document.getElementById('pw-input').value;
  if (val !== PW) {
    document.getElementById('pw-error').textContent = '비밀번호가 올바르지 않습니다';
    document.getElementById('pw-input').value = '';
    document.getElementById('pw-input').focus();
    return;
  }
  document.getElementById('pw-modal').classList.remove('show');
  try {
    if (pendingDeleteAll) {
      await remove(opinionsRef);
    } else if (pendingDeleteKey) {
      await remove(ref(db, 'opinions/' + pendingDeleteKey));
    }
  } catch(e) {
    alert('삭제 실패: ' + e.message);
  }
  pendingDeleteKey = null;
  pendingDeleteAll = false;
});

document.getElementById('pw-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('pw-confirm-btn').click();
});

document.getElementById('clear-all-btn').addEventListener('click', () => {
  pendingDeleteAll = true;
  pendingDeleteKey = null;
  openPwModal('전체 삭제하려면 비밀번호를 입력하세요');
});

// 피드 삭제 이벤트
document.getElementById('feed').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-del-key]');
  if (!btn) return;
  pendingDeleteKey = btn.dataset.delKey;
  pendingDeleteAll = false;
  openPwModal('의견을 삭제하려면 비밀번호를 입력하세요');
});

// 하트 모달
function openHeartModal(opinionKey, hearts) {
  pendingHeartKey = opinionKey;
  document.getElementById('heart-modal').classList.add('show');
  // 이미 하트 누른 팀 비활성화
  document.querySelectorAll('.heart-team-btn').forEach(b => {
    const idx = parseInt(b.dataset.teamIdx);
    const already = hearts && hearts[idx] === true;
    b.disabled = already;
    b.title = already ? '이미 하트를 눌렀습니다' : '';
  });
}

document.getElementById('heart-cancel-btn').addEventListener('click', () => {
  document.getElementById('heart-modal').classList.remove('show');
  pendingHeartKey = null;
});

document.getElementById('heart-team-grid').addEventListener('click', async (e) => {
  const btn = e.target.closest('.heart-team-btn');
  if (!btn || btn.disabled) return;
  const teamIdx = parseInt(btn.dataset.teamIdx);
  document.getElementById('heart-modal').classList.remove('show');
  if (pendingHeartKey) {
    try {
      const heartRef = ref(db, `opinions/${pendingHeartKey}/hearts/${teamIdx}`);
      await runTransaction(heartRef, (current) => {
        if (current === true) return; // 이미 눌렀으면 취소
        return true;
      });
    } catch(e) {
      alert('하트 처리 실패: ' + e.message);
    }
  }
  pendingHeartKey = null;
});

// 피드 하트 버튼 이벤트
document.getElementById('feed').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-heart-key]');
  if (!btn) return;
  const key = btn.dataset.heartKey;
  const op = opinions.find(o => o.key === key);
  if (!op) return;
  openHeartModal(key, op.hearts || {});
});

// 필터
document.getElementById('filter-row').addEventListener('click', (e) => {
  const chip = e.target.closest('[data-filter]');
  if (!chip) return;
  currentFilter = chip.dataset.filter;
  renderFeed();
});

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function heartCount(hearts) {
  if (!hearts) return 0;
  return Object.values(hearts).filter(v => v === true).length;
}

function renderFeed() {
  const feed = document.getElementById('feed');
  const filtered = currentFilter === 'all' ? opinions : opinions.filter(o => o.team === parseInt(currentFilter));
  if (filtered.length === 0) {
    feed.innerHTML = '<div class="empty-feed"><i class="ti ti-inbox"></i>아직 제출된 의견이 없습니다</div>';
  } else {
    feed.innerHTML = filtered.map(op => {
      const color = TEAM_COLOR(op.team);
      const t = new Date(op.time).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
      const hCount = heartCount(op.hearts);
      const heartedTeams = op.hearts ? Object.entries(op.hearts).filter(([,v])=>v===true).map(([k])=>parseInt(k)) : [];
      const teamChips = heartedTeams.map(ti =>
        `<span class="heart-team-chip ${TEAM_COLOR(ti)}">${TEAMS[ti]}</span>`
      ).join('');
      return `<div class="opinion-card">
        <div class="card-meta">
          <span class="team-tag ${color}">${TEAMS[op.team]}</span>
          <div class="card-right">
            <span class="card-time">${t}</span>
            <button class="card-del" data-del-key="${op.key}" title="삭제"><i class="ti ti-x"></i></button>
          </div>
        </div>
        ${op.title ? `<div class="card-title-text">${escapeHtml(op.title)}</div>` : ''}
        <div class="card-text">${escapeHtml(op.text)}</div>
        <div class="card-footer">
          <button class="heart-btn" data-heart-key="${op.key}">
            ❤️ ${hCount}
          </button>
        </div>
        ${heartedTeams.length > 0 ? `<div class="heart-teams">${teamChips}</div>` : ''}
      </div>`;
    }).join('');
  }
  buildFilters();
  renderStats();
}

function buildFilters() {
  const teams = [...new Set(opinions.map(o=>o.team))].sort((a,b)=>a-b);
  let html = `<span class="filter-chip ${currentFilter==='all'?'active':''}" data-filter="all">전체 ${opinions.length}</span>`;
  teams.forEach(t => {
    const cnt = opinions.filter(o=>o.team===t).length;
    html += `<span class="filter-chip ${currentFilter==t?'active':''}" data-filter="${t}">${TEAMS[t]} ${cnt}</span>`;
  });
  document.getElementById('filter-row').innerHTML = html;
}

function renderStats() {
  const totalH = opinions.reduce((sum, op) => sum + heartCount(op.hearts), 0);
  document.getElementById('total-count').textContent = opinions.length;
  document.getElementById('total-hearts').textContent = totalH;

  const maxOp = Math.max(...TEAMS.map((_,i)=>opinions.filter(o=>o.team===i).length), 1);
  document.getElementById('team-stats').innerHTML = TEAMS.map((t,i)=>{
    const cnt = opinions.filter(o=>o.team===i).length;
    return `<div class="team-stat-row">
      <span class="team-stat-name">${t}</span>
      <div class="team-stat-bar-wrap"><div class="team-stat-bar" style="width:${Math.round(cnt/maxOp*100)}%;background:${BAR_COLOR(i)}"></div></div>
      <span class="team-stat-count">${cnt}</span>
    </div>`;
  }).join('');

  const heartsByTeam = TEAMS.map((_,i) =>
    opinions.reduce((sum, op) => sum + (op.hearts && op.hearts[i] === true ? 1 : 0), 0)
  );
  const maxH = Math.max(...heartsByTeam, 1);
  document.getElementById('team-heart-stats').innerHTML = TEAMS.map((t,i)=>{
    return `<div class="team-stat-row">
      <span class="team-stat-name">${t}</span>
      <div class="team-stat-bar-wrap"><div class="team-stat-bar" style="width:${Math.round(heartsByTeam[i]/maxH*100)}%;background:${BAR_COLOR(i)}"></div></div>
      <span class="team-stat-count">❤️${heartsByTeam[i]}</span>
    </div>`;
  }).join('');
}

onValue(opinionsRef, (snapshot) => {
  setConnected(true);
  opinions = [];
  snapshot.forEach(child => {
    opinions.unshift({ key: child.key, ...child.val() });
  });
  renderFeed();
});

renderFeed();
</script>
</body>
</html>
